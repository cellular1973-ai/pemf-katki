name: Öneri
description: Yeni bir AI modülü, iyileştirme, rapor şablonu ya da arayüz önerisi
labels: ["oneri"]
body:
  - type: markdown
    attributes:
      value: "Sahada ölçtüğünüz bir sapma ya da yanlış ayar için **Düzeltme / kalibrasyon** formunu kullanın."
  - type: dropdown
    id: alan
    attributes:
      label: Alan
      options: ["AI modülü", "Açıklanabilirlik (XAI)", "Rapor şablonu", "Arayüz önerisi", "Belge / çeviri", "Diğer"]
    validations:
      required: true
  - type: textarea
    id: sorun
    attributes:
      label: Hangi sorunu çözüyor?
      description: Kim için (hekim, hayvan sahibi, araştırmacı), hangi durumda?
    validations:
      required: true
  - type: textarea
    id: oneri
    attributes:
      label: Öneriniz
      description: Ne yapılacak? AI modülüyse girdi türü, çıktı etiketleri ve kullanacağınız veri.
    validations:
      required: true
  - type: textarea
    id: taslak
    attributes:
      label: Taslak / ekran görüntüsü (isteğe bağlı)
      description: Dosyaları buraya sürükleyip bırakabilirsiniz.
