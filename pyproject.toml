[tool.ruff]
line-length = 140
target-version = "py310"
# Öneri klasörlerindeki analiz betikleri / not defterleri biçim denetimine girmez (CI'ı kırmasın).
extend-exclude = ["oneriler"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["moduller", "tests"]
addopts = "-q"
